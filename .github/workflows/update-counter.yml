name: Update Page Visit Counter

on:
  page_build:
  workflow_dispatch:
  # Also trigger on pushes to main/master branch that modify HTML files
  push:
    branches: [main, master, github-csv-search-page-a7812]
    paths: ['*.html', '*.js']

jobs:
  update-counter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Read current count
        id: read-count
        run: |
          if [ -f counter.json ]; then
            COUNT=$(jq -r '.count' counter.json)
          else
            COUNT=0
          fi
          echo "current_count=$COUNT" >> $GITHUB_OUTPUT
      
      - name: Increment count
        id: increment
        run: |
          NEW_COUNT=$((${{ steps.read-count.outputs.current_count }} + 1))
          echo "new_count=$NEW_COUNT" >> $GITHUB_OUTPUT
      
      - name: Update counter file
        run: |
          echo "{\"count\": ${{ steps.increment.outputs.new_count }}}" > counter.json
      
      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add counter.json
          if ! git diff --staged --quiet; then
            git commit -m "📊 Update page visit counter to ${{ steps.increment.outputs.new_count }}"
            git push
          else
            echo "No changes to commit"
          fi
